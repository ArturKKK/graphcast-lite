# Настройка линтера. Философия простая: проверка должна быть ЗЕЛЁНОЙ, иначе её
# начнут пропускать, и она перестанет ловить что бы то ни было.
#
# Поэтому два уровня. Везде — правила, которые ловят настоящие ошибки, и им
# код уже соответствует. В каталогах, которые поддерживаются и закрыты тестами,
# дополнительно порядок: сортировка импортов, отсутствие мусора, длина строк.
#
# Остальное — не «плохой код», а не приведённый к этому уровню. Список
# послаблений внизу и есть список долгов; он должен укорачиваться, а не расти.

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", "docs/paper/runs", "website", "notebooks"]

[tool.ruff.lint]
# E9 — синтаксис и отступы, из-за которых файл не запустится.
# F821 — обращение к неопределённому имени: самая дорогая ошибка, падает в
#        работе и только на той ветке, куда дошло исполнение.
# F811 — повторное определение: первое становится мёртвым молча.
# B006/B026 — изменяемое значение по умолчанию и распаковка перед звёздочкой.
# F502/F506/F602/F621 — ошибки форматирования и распаковки.
select = ["E9", "F821", "F811", "F502", "F506", "F602", "F621", "B006", "B026"]

# B023 — замыкание над переменной цикла. У нас такие замыкания всегда
#        вызываются в той же итерации, где созданы, так что позднего связывания
#        не возникает; правило даёт только ложные срабатывания.
# B905 — zip без strict. Полезно, но в наших местах длины гарантированы
#        построением (np.unique и подобное), а разбирать все — отдельная работа.
ignore = ["B023", "B905"]

[tool.ruff.lint.per-file-ignores]
# Тестам можно голые assert и длинные имена.
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]
