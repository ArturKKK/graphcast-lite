# Строгий набор для каталогов, которые поддерживаются и закрыты тестами.
# Зовётся отдельно из scripts/check.sh — именно этому уровню должен
# соответствовать весь новый код.
extend = "pyproject.toml"
line-length = 100

[lint]
select = ["E", "F", "I", "B", "SIM", "RET", "W", "UP"]
ignore = [
    "B023",     # см. pyproject.toml
    "B905",
    "E402",     # импорт после кода: у скриптов сначала настраивается sys.path
    "UP006",    # typing.List вместо list — косметика, трогать весь код незачем
    "UP035",
    "UP045",
    "E741",     # имена вроде l для широты приняты в этом коде
    "SIM105",   # contextlib.suppress вместо try/except pass — дело вкуса
    "SIM108",   # тернарник вместо if/else — не всегда читаемее
    "B904",     # raise ... from — уточним при следующем проходе по ошибкам
]
