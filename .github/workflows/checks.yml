name: проверки

# Гоняется на каждый push в рабочую ветку и на каждый pull request.
# Два задания. Быстрое — линтер и те тесты, которым torch не нужен: около
# минуты, и оно ловит подавляющее большинство поломок. Полное ставит torch и
# гоняет всё, включая целевую функцию, повороты и развёртку: несколько минут.
#
# Разделены нарочно: быстрый ответ приходит сразу, а долгий можно не ждать.

on:
  push:
    branches: [main, main-arthur]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: линтер и тесты без torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: зависимости
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q ruff pytest coverage numpy scipy pandas pyarrow trimesh pydantic
      - name: линтер
        run: bash scripts/check.sh --fast
      - name: тесты без torch
        run: PYTHONPATH=. python -m pytest tests/ -q

  full:
    name: все тесты с torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: зависимости
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q pytest numpy scipy pandas pyarrow trimesh pydantic rtree
          # torch только под процессор: обучать в CI не нужно, нужно проверить
          # формы, повороты, веса потерь и развёртку.
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q torch_geometric wandb tqdm matplotlib
      - name: тесты
        run: PYTHONPATH=. python -m pytest tests/ -q
      - name: проверка, что ничего не пропущено
        run: |
          # Если torch на месте, пропусков быть не должно. Иначе зелёный ответ
          # обманчив: половина проверок просто не выполнялась.
          out=$(PYTHONPATH=. python -m pytest tests/ -q 2>&1 | tail -1)
          echo "$out"
          case "$out" in
            *skipped*) echo "ОШИБКА: есть пропущенные тесты, хотя torch установлен"; exit 1;;
          esac
