<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" width="1020" height="430" font-family="Times New Roman, Times, serif">
<rect width="1020" height="430" fill="#ffffff"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
  </marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
  </marker>
</defs>

<!-- ── (а) поток данных ─────────────────────────────────────── -->
<text x="24" y="30" font-size="19" font-weight="bold">(а)</text>

<!-- вход: расчётная сетка -->
<rect x="60" y="62" width="150" height="104" fill="none" stroke="#000" stroke-width="1.4"/>
<g stroke="#7a7a7a" stroke-width="0.7">
  <line x1="60" y1="88" x2="210" y2="88"/><line x1="60" y1="114" x2="210" y2="114"/>
  <line x1="60" y1="140" x2="210" y2="140"/>
  <line x1="98" y1="62" x2="98" y2="166"/><line x1="136" y1="62" x2="136" y2="166"/>
  <line x1="174" y1="62" x2="174" y2="166"/>
</g>
<rect x="98" y="88" width="76" height="52" fill="none" stroke="#000" stroke-width="1.4"/>
<g stroke="#000" stroke-width="0.5">
  <line x1="98" y1="101" x2="174" y2="101"/><line x1="98" y1="114" x2="174" y2="114"/>
  <line x1="98" y1="127" x2="174" y2="127"/>
  <line x1="117" y1="88" x2="117" y2="140"/><line x1="136" y1="88" x2="136" y2="140"/>
  <line x1="155" y1="88" x2="155" y2="140"/>
</g>
<text x="135" y="186" font-size="15" text-anchor="middle">расчётная сетка</text>
<text x="135" y="205" font-size="14" text-anchor="middle" fill="#333">133 279 узлов, 33 канала</text>
<text x="135" y="223" font-size="13" text-anchor="middle" fill="#555">два среза, 12 ч</text>

<!-- кодировщик -->
<line x1="216" y1="114" x2="266" y2="114" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="270" y="80" width="104" height="68" fill="#f0f0f0" stroke="#000" stroke-width="1.4"/>
<text x="322" y="110" font-size="15" text-anchor="middle">кодиров-</text>
<text x="322" y="128" font-size="15" text-anchor="middle">щик</text>

<!-- граф-мозаика -->
<line x1="378" y1="114" x2="418" y2="114" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<g stroke="#000" stroke-width="1" fill="none">
  <polygon points="470,66 518,94 518,148 470,176 422,148 422,94"/>
  <line x1="470" y1="66" x2="470" y2="176"/><line x1="422" y1="94" x2="518" y2="148"/>
  <line x1="422" y1="148" x2="518" y2="94"/>
</g>
<g fill="#000">
  <circle cx="470" cy="66" r="3.6"/><circle cx="518" cy="94" r="3.6"/><circle cx="518" cy="148" r="3.6"/>
  <circle cx="470" cy="176" r="3.6"/><circle cx="422" cy="148" r="3.6"/><circle cx="422" cy="94" r="3.6"/>
  <circle cx="470" cy="121" r="3.6"/>
</g>
<text x="470" y="205" font-size="15" text-anchor="middle">граф-мозаика</text>
<text x="470" y="223" font-size="13" text-anchor="middle" fill="#555">уровни 4 и 6, латент 256</text>

<!-- процессор -->
<line x1="524" y1="114" x2="566" y2="114" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="570" y="72" width="140" height="84" fill="#f0f0f0" stroke="#000" stroke-width="1.4"/>
<text x="640" y="100" font-size="15" text-anchor="middle">процессор</text>
<text x="640" y="120" font-size="14" text-anchor="middle">Interaction Net</text>
<text x="640" y="140" font-size="14" text-anchor="middle" font-weight="bold">R = 12 раундов</text>
<path d="M578,164 C578,190 702,190 702,164" fill="none" stroke="#555" stroke-width="1.1" marker-end="url(#arw)"/>
<text x="640" y="203" font-size="13" text-anchor="middle" fill="#555">веса раундов не разделяются</text>

<!-- декодировщик -->
<line x1="714" y1="114" x2="754" y2="114" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="758" y="80" width="104" height="68" fill="#f0f0f0" stroke="#000" stroke-width="1.4"/>
<text x="810" y="110" font-size="15" text-anchor="middle">декодиров-</text>
<text x="810" y="128" font-size="15" text-anchor="middle">щик</text>

<!-- выход -->
<line x1="866" y1="114" x2="906" y2="114" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="910" y="86" width="72" height="56" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="946" y="118" font-size="17" text-anchor="middle">Δx</text>
<text x="946" y="162" font-size="15" text-anchor="middle">приращения</text>
<text x="946" y="180" font-size="15" text-anchor="middle">полей</text>

<!-- авторегрессия -->
<path d="M946,196 C946,246 135,252 135,238" fill="none" stroke="#000" stroke-width="1.3"
      stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="540" y="268" font-size="15" text-anchor="middle">авторегрессия: шаг 6 ч, K шагов развёртки</text>

<!-- ── (б) две фазы дообучения ──────────────────────────────── -->
<line x1="60" y1="292" x2="982" y2="292" stroke="#bbb" stroke-width="1"/>
<text x="24" y="325" font-size="19" font-weight="bold">(б)</text>

<rect x="60" y="308" width="380" height="72" fill="none" stroke="#000" stroke-width="1.4"/>
<text x="250" y="332" font-size="15" text-anchor="middle" font-weight="bold">фаза 1: эпохи 1…<tspan font-style="italic">E</tspan><tspan font-size="11" dy="4">f</tspan></text>
<text x="250" y="354" font-size="14" text-anchor="middle">процессор заморожен,</text>
<text x="250" y="372" font-size="14" text-anchor="middle">обучаются кодировщик и декодировщик</text>

<line x1="446" y1="344" x2="486" y2="344" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="490" y="308" width="380" height="72" fill="#f0f0f0" stroke="#000" stroke-width="1.4"/>
<text x="680" y="332" font-size="15" text-anchor="middle" font-weight="bold">фаза 2: остальные эпохи</text>
<text x="680" y="354" font-size="14" text-anchor="middle">процессор разморожен,</text>
<text x="680" y="372" font-size="14" text-anchor="middle">его темп обучения в 10 раз меньше базового</text>

<text x="880" y="348" font-size="14" fill="#555"><tspan font-style="italic">E</tspan><tspan font-size="11" dy="3">f</tspan><tspan dy="-3"> = 10</tspan></text>
</svg>
